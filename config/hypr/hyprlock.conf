# ~/.config/hypr/hyprlock.conf
general {
  hide_cursor = true
}

animations {
  enabled = true
}

background {
  monitor =
  path    = ~/.config/hypr/wallpapers/wallpaper.png
  blur_passes = 0
  brightness  = 0.5
}
# Clock
label {
  monitor     =
  text        = $TIME
  font_size   = 86
  font_family = Departure Mono
  color       = rgba(236, 239, 193, 0.70)
  position    = 1275, 120
  halign      = center
  valign      = center
}
# Date
label {
  monitor     =
  text        = cmd[update:1000] date +"%A, %B %d"
  font_size   = 24
  font_family = Departure Mono
  color       = rgba(136, 144, 184, 0.85)
  position    = 1275, 40
  halign      = center
  valign      = center
}
# Password box
input-field {
  monitor  =
  size     = 340, 58
  position = 1275, -40
  halign   = center
  valign   = center
  outline_thickness = 3
  rounding          = 4
  dots_size     = 0.26
  dots_spacing  = 0.42
  dots_center   = true
  fade_on_empty = true
  hide_input    = true
  placeholder_text = <i>password</i>
  inner_color  = rgba(30, 32, 96, 0.65)
  outer_color  = rgba(232, 80, 91, 0.75)
  font_color   = rgba(200, 202, 232, 0.95)
  check_color  = rgba(6, 175, 199, 0.80)
  fail_color   = rgba(255, 63, 164, 0.80)
}
# Wrong password
label {
  monitor     =
  text        = $FAIL
  font_size   = 16
  font_family = Departure Mono
  color       = rgba(255, 63, 164, 0.85)
  position    = 1275, -112
  halign      = center
  valign      = center
}
# Footer: user@host
label {
  monitor     =
  text        = cmd[update:2000] echo "$(whoami)@$(uname -n)"
  font_size   = 14
  font_family = Departure Mono
  color       = rgba(136, 144, 184, 0.70)
  position    = 1275, -160
  halign      = center
  valign      = center
}
