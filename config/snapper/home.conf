# home.conf - snapper settings for /home. No pacman pairs here, timeline only.
# Snapshots live in /home/.snapshots (nested in @home), so they are excluded
# from root snapshots and survive a root rollback.
NUMBER_CLEANUP=yes
NUMBER_LIMIT=10
TIMELINE_CREATE=yes
TIMELINE_CLEANUP=yes
TIMELINE_MIN_AGE=1800
TIMELINE_LIMIT_HOURLY=0
TIMELINE_LIMIT_DAILY=7
TIMELINE_LIMIT_WEEKLY=4
TIMELINE_LIMIT_MONTHLY=0
TIMELINE_LIMIT_QUARTERLY=0
TIMELINE_LIMIT_YEARLY=0
EMPTY_PRE_POST_CLEANUP=yes
SPACE_LIMIT=0.5
FREE_LIMIT=0.2
