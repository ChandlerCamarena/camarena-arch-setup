# root.conf - snapper settings for /, applied with `snapper -c root set-config`
# by scripts/lib/snapshots.sh. Only keys listed here are changed.
#
# NUMBER_*   : pacman pre/post pairs from snap-pac (cleanup algorithm "number")
# TIMELINE_* : daily snapshots (snapper-timeline.timer, daily drop-in), pruned by
#              snapper-cleanup.timer. Without the cleanup timer nothing is
#              ever deleted.
NUMBER_CLEANUP=yes
NUMBER_MIN_AGE=1800
NUMBER_LIMIT=10
NUMBER_LIMIT_IMPORTANT=10
TIMELINE_CREATE=yes
TIMELINE_CLEANUP=yes
TIMELINE_MIN_AGE=1800
TIMELINE_LIMIT_HOURLY=0
TIMELINE_LIMIT_DAILY=7
TIMELINE_LIMIT_WEEKLY=4
TIMELINE_LIMIT_MONTHLY=0
TIMELINE_LIMIT_QUARTERLY=0
TIMELINE_LIMIT_YEARLY=0
EMPTY_PRE_POST_CLEANUP=yes
SPACE_LIMIT=0.5
FREE_LIMIT=0.2
