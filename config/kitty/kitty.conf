font_family      Departure Mono
font_size        13
disable_ligatures no
enable_audio_bell no
shell zsh
shell_integration enabled
remember_window_size no
window_padding_width 10
background_opacity 0.85
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0
sync_to_monitor no

allow_remote_control yes
listen_on unix:/tmp/kitty-socket-{kitty_pid}

# --------------------------------------------------------
# COLORS -- generated from theme.json, see generate-colors.sh
# color4/color12/color15 are not in the theme.json palette,
# kept hardcoded here.
# --------------------------------------------------------
color4                 #6b8fc4
color12                #67a0cd
color15                #ffffff
include colors-generated.conf

# Simulate Arrow Keys with Alt + HJKL for history and cursor navigation
map alt+h send_text all \x1b[D
map alt+j send_text all \x1b[B
map alt+k send_text all \x1b[A
map alt+l send_text all \x1b[C
